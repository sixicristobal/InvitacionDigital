# version removed (obsolete)

services:
  app:
    build: .
    ports:
      - "8084:80"
    environment:
      DB_HOST: mariadb
      DB_DATABASE: boda_invitaciones
      DB_USER: sixinio
      DB_PASSWORD: 123456
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - .:/var/www/html

  migrate:
    build: .
    command: ["php", "/var/www/html/bin/migrate.php"]
    environment:
      DB_HOST: mariadb
      DB_DATABASE: boda_invitaciones
      DB_USER: sixinio
      DB_PASSWORD: 123456
    depends_on:
      mariadb:
        condition: service_healthy
    restart: "no"

  db:
    profiles: ["legacy"]
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: boda_invitaciones
      MYSQL_USER: sixinio
      MYSQL_PASSWORD: 123456
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: 123456
      MARIADB_DATABASE: boda_invitaciones
      MARIADB_USER: sixinio
      MARIADB_PASSWORD: 123456
    ports:
      - "3308:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  db_data:
  mariadb_data:
